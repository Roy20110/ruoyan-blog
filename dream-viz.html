<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦境可视化 | 若颜的梦境日志</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-deep:#0a0a14;
  --bg-mid:#12121f;
  --card:rgba(20,20,35,0.7);
  --card-border:rgba(100,100,160,0.2);
  --text-primary:#e8e8f0;
  --text-secondary:#9090a8;
  --text-muted:#606078;
  --accent-purple:#8b5cf6;
  --accent-blue:#3b82f6;
  --accent-pink:#ec4899;
  --accent-teal:#14b8a6;
  --accent-amber:#f59e0b;
}
body{
  font-family:'Georgia','Noto Serif SC',serif;
  background:var(--bg-deep);
  color:var(--text-primary);
  min-height:100vh;
  overflow:hidden;
}
#starfield{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  z-index:0;
}
.container{
  position:relative;z-index:1;
  display:grid;
  grid-template-columns:380px 1fr;
  height:100vh;
  gap:0;
}
/* 左侧面板 */
.panel{
  background:var(--card);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--card-border);
  padding:28px 24px;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
}
.panel-header{
  margin-bottom:24px;
}
.panel-title{
  font-size:22px;
  font-weight:700;
  letter-spacing:2px;
  background:linear-gradient(135deg,var(--accent-purple),var(--accent-pink));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:6px;
}
.panel-subtitle{
  font-size:12px;
  color:var(--text-muted);
  letter-spacing:1px;
}
.input-section{
  margin-bottom:20px;
}
.input-label{
  font-size:13px;
  color:var(--text-secondary);
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:6px;
}
.input-label svg{width:14px;height:14px;fill:var(--accent-purple)}
textarea{
  width:100%;
  min-height:140px;
  background:rgba(10,10,20,0.6);
  border:1px solid var(--card-border);
  border-radius:10px;
  padding:14px;
  color:var(--text-primary);
  font-family:inherit;
  font-size:14px;
  line-height:1.7;
  resize:vertical;
  outline:none;
  transition:border-color 0.3s;
}
textarea:focus{
  border-color:var(--accent-purple);
}
textarea::placeholder{color:var(--text-muted)}
.title-input{
  width:100%;
  background:rgba(10,10,20,0.6);
  border:1px solid var(--card-border);
  border-radius:10px;
  padding:10px 14px;
  color:var(--text-primary);
  font-family:inherit;
  font-size:14px;
  outline:none;
  transition:border-color 0.3s;
  margin-bottom:12px;
}
.title-input:focus{border-color:var(--accent-purple)}
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.3s;
  font-family:inherit;
  letter-spacing:1px;
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent-purple),var(--accent-pink));
  color:#fff;
}
.btn-primary:hover{
  transform:translateY(-1px);
  box-shadow:0 4px 20px rgba(139,92,246,0.4);
}
.btn-secondary{
  background:rgba(100,100,160,0.15);
  color:var(--text-secondary);
  border:1px solid var(--card-border);
}
.btn-secondary:hover{
  background:rgba(100,100,160,0.25);
  color:var(--text-primary);
}
.btn-group{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}
/* 情绪分析结果 */
.analysis-result{
  margin-top:20px;
  padding-top:20px;
  border-top:1px solid var(--card-border);
}
.analysis-title{
  font-size:13px;
  color:var(--text-secondary);
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:6px;
}
.analysis-title svg{width:14px;height:14px;fill:var(--accent-teal)}
.emotion-bars{display:flex;flex-direction:column;gap:10px}
.emotion-row{
  display:flex;align-items:center;gap:10px;
}
.emotion-name{
  width:50px;
  font-size:12px;
  color:var(--text-secondary);
  flex-shrink:0;
}
.emotion-bar-bg{
  flex:1;
  height:6px;
  background:rgba(100,100,160,0.15);
  border-radius:3px;
  overflow:hidden;
}
.emotion-bar-fill{
  height:100%;
  border-radius:3px;
  transition:width 0.8s ease;
  width:0%;
}
.emotion-value{
  width:36px;
  font-size:11px;
  color:var(--text-muted);
  text-align:right;
}
.keywords-section{
  margin-top:16px;
}
.keywords-title{
  font-size:12px;
  color:var(--text-muted);
  margin-bottom:8px;
}
.keywords-tags{
  display:flex;flex-wrap:wrap;gap:6px;
}
.keyword-tag{
  padding:4px 10px;
  background:rgba(139,92,246,0.15);
  border:1px solid rgba(139,92,246,0.3);
  border-radius:12px;
  font-size:11px;
  color:var(--accent-purple);
}
/* 历史记录 */
.history-section{
  margin-top:20px;
  padding-top:20px;
  border-top:1px solid var(--card-border);
  flex:1;
  overflow-y:auto;
}
.history-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.history-title{
  font-size:13px;
  color:var(--text-secondary);
  display:flex;align-items:center;gap:6px;
}
.history-title svg{width:14px;height:14px;fill:var(--accent-amber)}
.clear-history{
  background:none;border:none;
  font-size:11px;color:var(--text-muted);
  cursor:pointer;padding:4px 8px;border-radius:6px;
}
.clear-history:hover{color:var(--accent-pink);background:rgba(236,72,153,0.1)}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{
  padding:10px 12px;
  background:rgba(10,10,20,0.4);
  border:1px solid var(--card-border);
  border-radius:8px;
  cursor:pointer;
  transition:all 0.2s;
}
.history-item:hover{
  border-color:var(--accent-purple);
  background:rgba(139,92,246,0.1);
}
.history-item-title{
  font-size:13px;
  color:var(--text-primary);
  margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.history-item-meta{
  font-size:10px;
  color:var(--text-muted);
  display:flex;justify-content:space-between;
}
.history-empty{
  font-size:12px;
  color:var(--text-muted);
  text-align:center;
  padding:20px;
}
/* 右侧可视化区域 */
.viz-area{
  position:relative;
  display:flex;
  flex-direction:column;
}
#vizCanvas{
  flex:1;
  width:100%;
}
.viz-overlay{
  position:absolute;
  top:24px;left:24px;
  z-index:2;
  pointer-events:none;
}
.viz-dream-title{
  font-size:28px;
  font-weight:700;
  color:var(--text-primary);
  margin-bottom:8px;
  opacity:0.9;
  text-shadow:0 2px 20px rgba(0,0,0,0.5);
}
.viz-dream-mood{
  font-size:14px;
  color:var(--text-secondary);
  letter-spacing:2px;
}
.viz-controls{
  position:absolute;
  bottom:24px;right:24px;
  z-index:2;
  display:flex;gap:8px;
}
.viz-btn{
  width:44px;height:44px;
  background:var(--card);
  backdrop-filter:blur(10px);
  border:1px solid var(--card-border);
  border-radius:10px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.viz-btn:hover{
  border-color:var(--accent-purple);
  background:rgba(139,92,246,0.2);
}
.viz-btn svg{width:18px;height:18px;fill:var(--text-secondary)}
.viz-btn:hover svg{fill:var(--accent-purple)}
/* 导航链接 */
.nav-links{
  position:absolute;
  top:24px;right:24px;
  z-index:2;
  display:flex;gap:12px;
}
.nav-links a{
  color:var(--text-muted);
  text-decoration:none;
  font-size:12px;
  letter-spacing:1px;
  padding:6px 12px;
  border-radius:6px;
  transition:all 0.2s;
  font-family:sans-serif;
}
.nav-links a:hover{
  color:var(--text-primary);
  background:rgba(255,255,255,0.05);
}
/* 响应式 */
@media(max-width:900px){
  .container{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .panel{max-height:50vh;border-right:none;border-bottom:1px solid var(--card-border)}
  .viz-area{min-height:400px}
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="container">
  <!-- 左侧面板 -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">梦境可视化</div>
      <div class="panel-subtitle">DREAM VISUALIZATION</div>
    </div>

    <div class="input-section">
      <div class="input-label">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        梦境标题
      </div>
      <input type="text" class="title-input" id="dreamTitle" placeholder="给这个梦起个名字...">
      
      <div class="input-label" style="margin-top:12px">
        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        梦境内容
      </div>
      <textarea id="dreamText" placeholder="描述你的梦境...&#10;&#10;例如：我走在一条没有尽头的走廊里，灯光闪烁不定，远处传来模糊的声音。我推开门，发现自己回到了小时候的学校，但一切都扭曲变形了..."></textarea>
    </div>

    <button class="btn btn-primary" onclick="visualizeDream()">生成梦境可视化</button>
    
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="saveDream()">保存梦境</button>
      <button class="btn btn-secondary" onclick="clearInput()">清空</button>
    </div>

    <!-- 情绪分析结果 -->
    <div class="analysis-result" id="analysisResult" style="display:none">
      <div class="analysis-title">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        情绪分析
      </div>
      <div class="emotion-bars" id="emotionBars"></div>
      <div class="keywords-section">
        <div class="keywords-title">提取的梦境符号</div>
        <div class="keywords-tags" id="keywordsTags"></div>
      </div>
    </div>

    <!-- 历史记录 -->
    <div class="history-section">
      <div class="history-header">
        <div class="history-title">
          <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
          梦境记录
        </div>
        <button class="clear-history" onclick="clearHistory()">清空</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty">暂无梦境记录</div>
      </div>
    </div>
  </div>

  <!-- 右侧可视化 -->
  <div class="viz-area">
    <div class="nav-links">
      <a href="index.html">博客首页</a>
      <a href="emotion-viz.html">情绪分析</a>
    </div>
    <div class="viz-overlay">
      <div class="viz-dream-title" id="vizTitle">等待梦境输入</div>
      <div class="viz-dream-mood" id="vizMood">输入你的梦境，生成专属可视化</div>
    </div>
    <canvas id="vizCanvas"></canvas>
    <div class="viz-controls">
      <button class="viz-btn" onclick="exportImage()" title="导出图片">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      </button>
      <button class="viz-btn" onclick="regenerate()" title="重新生成">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </div>
</div>

function analyzeEmotions(text){
  const emotions = {joy:0, sadness:0, fear:0, anger:0, calm:0, surprise:0};
  const symbols = [];
  const totalWords = text.length || 1;
  
  Object.keys(emotionDict).forEach(emotion=>{
    emotionDict[emotion].words.forEach(word=>{
      const regex = new RegExp(word, 'g');
      const matches = text.match(regex);
      if(matches){
        emotions[emotion] += matches.length;
      }
    });
  });
  
  // 提取梦境符号
  dreamSymbols.forEach(symbol=>{
    if(text.includes(symbol) && !symbols.includes(symbol)){
      symbols.push(symbol);
    }
  });
  
  // 归一化
  const max = Math.max(...Object.values(emotions), 1);
  Object.keys(emotions).forEach(key=>{
    emotions[key] = Math.round((emotions[key]/max)*100);
  });
  
  return {emotions, symbols:symbols.slice(0,12)};
}

// 粒子类
class Particle {
  constructor(x, y, emotion, color){
    this.x = x;
    this.y = y;
    this.vx = (Math.random()-0.5) * emotion.particleSpeed;
    this.vy = (Math.random()-0.5) * emotion.particleSpeed;
    this.size = emotion.particleSize + Math.random()*3;
    this.color = color;
    this.life = 1;
    this.decay = Math.random()*0.005 + 0.002;
    this.angle = Math.random()*Math.PI*2;
    this.flowOffset = Math.random()*1000;
  }
  update(flowStrength){
    this.angle += flowStrength;
    this.x += this.vx + Math.cos(this.angle)*0.5;
    this.y += this.vy + Math.sin(this.angle)*0.5;
    this.life -= this.decay;
    if(this.x < 0) this.x = vizCanvas.width;
    if(this.x > vizCanvas.width) this.x = 0;
    if(this.y < 0) this.y = vizCanvas.height;
    if(this.y > vizCanvas.height) this.y = 0;
  }
  draw(ctx){
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = this.color.replace('1)', `${this.life*0.6})`);
    ctx.fill();
  }
}

// 浮动形状类
class FloatingShape {
  constructor(x, y, color, type){
    this.x = x;
    this.y = y;
    this.size = Math.random()*60 + 20;
    this.color = color;
    this.type = type;
    this.rotation = Math.random()*Math.PI*2;
    this.rotationSpeed = (Math.random()-0.5)*0.01;
    this.floatOffset = Math.random()*1000;
    this.floatSpeed = Math.random()*0.005 + 0.002;
    this.opacity = Math.random()*0.15 + 0.05;
  }
  update(){
    this.rotation += this.rotationSpeed;
    this.y += Math.sin(Date.now()*this.floatSpeed + this.floatOffset)*0.3;
    this.x += Math.cos(Date.now()*this.floatSpeed*0.7 + this.floatOffset)*0.2;
  }
  draw(ctx){
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.globalAlpha = this.opacity;
    ctx.fillStyle = this.color;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 1;
    
    if(this.type === 0){
      // 圆形
      ctx.beginPath();
      ctx.arc(0, 0, this.size/2, 0, Math.PI*2);
      ctx.fill();
    }else if(this.type === 1){
      // 矩形
      ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
    }else if(this.type === 2){
      // 三角形
      ctx.beginPath();
      ctx.moveTo(0, -this.size/2);
      ctx.lineTo(this.size/2, this.size/2);
      ctx.lineTo(-this.size/2, this.size/2);
      ctx.closePath();
      ctx.fill();
    }else{
      // 圆环
      ctx.beginPath();
      ctx.arc(0, 0, this.size/2, 0, Math.PI*2);
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }
}

// 生成可视化
function generateVisualization(emotions, symbols){
  particles = [];
  shapes = [];
  
  // 计算主色调
  const dominantEmotion = Object.keys(emotions).reduce((a,b)=>emotions[a]>emotions[b]?a:b);
  const dominantConfig = emotionConfig[dominantEmotion];
  
  // 创建浮动形状
  const shapeCount = 15;
  for(let i=0;i<shapeCount;i++){
    const emotionKey = Object.keys(emotions)[Math.floor(Math.random()*6)];
    const config = emotionConfig[emotionKey];
    const shape = new FloatingShape(
      Math.random()*vizCanvas.width,
      Math.random()*vizCanvas.height,
      config.color,
      Math.floor(Math.random()*4)
    );
    shapes.push(shape);
  }
  
  // 创建粒子
  const particleCount = 150;
  for(let i=0;i<particleCount;i++){
    const emotionKey = Object.keys(emotions)[Math.floor(Math.random()*6)];
    const config = emotionConfig[emotionKey];
    const particle = new Particle(
      Math.random()*vizCanvas.width,
      Math.random()*vizCanvas.height,
      config,
      config.color + '1)'
    );
    particles.push(particle);
  }
  
  // 更新标题
  const title = document.getElementById('dreamTitle').value || '未命名梦境';
  document.getElementById('vizTitle').textContent = title;
  document.getElementById('vizMood').textContent = `主导情绪：${dominantConfig.name} | 符号：${symbols.length}个`;
}

// 动画循环
function animate(){
  // 半透明背景实现拖尾效果
  vizCtx.fillStyle = 'rgba(10,10,20,0.05)';
  vizCtx.fillRect(0,0,vizCanvas.width,vizCanvas.height);
  
  // 计算流场强度
  let flowStrength = 0;
  Object.keys(currentEmotions).forEach(key=>{
    flowStrength += currentEmotions[key] * emotionConfig[key].flow / 100;
  });
  
  // 更新和绘制形状
  shapes.forEach(shape=>{
    shape.update();
    shape.draw(vizCtx);
  });
  
  // 更新和绘制粒子
  particles = particles.filter(p=>p.life > 0);
  particles.forEach(particle=>{
    particle.update(flowStrength);
    particle.draw(vizCtx);
  });
  
  // 补充粒子
  if(particles.length < 100){
    const emotionKey = Object.keys(currentEmotions)[Math.floor(Math.random()*6)];
    const config = emotionConfig[emotionKey];
    particles.push(new Particle(
      Math.random()*vizCanvas.width,
      Math.random()*vizCanvas.height,
      config,
      config.color + '1)'
    ));
  }
  
  animationId = requestAnimationFrame(animate);
}

// 可视化梦境
function visualizeDream(){
  const text = document.getElementById('dreamText').value.trim();
  if(!text){
    alert('请输入梦境内容');
    return;
  }
  
  const result = analyzeEmotions(text);
  currentEmotions = result.emotions;
  currentSymbols = result.symbols;
  
  // 显示分析结果
  document.getElementById('analysisResult').style.display = 'block';
  renderEmotionBars(result.emotions);
  renderKeywords(result.symbols);
  
  // 生成可视化
  generateVisualization(result.emotions, result.symbols);
  
  if(animationId) cancelAnimationFrame(animationId);
  animate();
}

// 保存梦境
function saveDream(){
  const title = document.getElementById('dreamTitle').value.trim() || '未命名梦境';
  const text = document.getElementById('dreamText').value.trim();
  if(!text){
    alert('请输入梦境内容');
    return;
  }
  
  const dream = {
    id: Date.now(),
    title,
    text,
    emotions: currentEmotions,
    symbols: currentSymbols,
    date: new Date().toLocaleString('zh-CN')
  };
  
  dreams.unshift(dream);
  if(dreams.length > 50) dreams = dreams.slice(0,50);
  localStorage.setItem('dreamJournal', JSON.stringify(dreams));
  renderHistory();
  alert('梦境已保存');
}

// 渲染历史
function renderHistory(){
  const container = document.getElementById('historyList');
  if(dreams.length === 0){
    container.innerHTML = '<div class="history-empty">暂无梦境记录</div>';
    return;
  }
  container.innerHTML = dreams.map(dream=>`
    <div class="history-item" onclick="loadDream(${dream.id})">
      <div class="history-item-title">${dream.title}</div>
      <div class="history-item-meta">
        <span>${dream.date}</span>
        <span>${dream.symbols.length}个符号</span>
      </div>
    </div>
  `).join('');
}

// 加载梦境
function loadDream(id){
  const dream = dreams.find(d=>d.id === id);
  if(!dream) return;
  document.getElementById('dreamTitle').value = dream.title;
  document.getElementById('dreamText').value = dream.text;
  currentEmotions = dream.emotions;
  currentSymbols = dream.symbols;
  document.getElementById('analysisResult').style.display = 'block';
  renderEmotionBars(dream.emotions);
  renderKeywords(dream.symbols);
  generateVisualization(dream.emotions, dream.symbols);
  if(animationId) cancelAnimationFrame(animationId);
  animate();
}

// 清空历史
function clearHistory(){
  if(confirm('确定要清空所有梦境记录吗？')){
    dreams = [];
    localStorage.removeItem('dreamJournal');
    renderHistory();
  }
}

// 清空输入
function clearInput(){
  document.getElementById('dreamTitle').value = '';
  document.getElementById('dreamText').value = '';
  document.getElementById('analysisResult').style.display = 'none';
}

// 导出图片
function exportImage(){
  const link = document.createElement('a');
  link.download = `梦境可视化_${Date.now()}.png`;
  link.href = vizCanvas.toDataURL('image/png');
  link.click();
}

// 重新生成
function regenerate(){
  const text = document.getElementById('dreamText').value.trim();
  if(text){
    visualizeDream();
  }
}

// 初始化
renderHistory();

// 初始生成一个默认可视化
currentEmotions = {joy:20, sadness:30, fear:40, anger:10, calm:50, surprise:35};
currentSymbols = ['梦境','走廊','光','影子'];
generateVisualization(currentEmotions, currentSymbols);
animate();
</script>
